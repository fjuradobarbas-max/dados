<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Dados</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INICIO -->

<div id="inicio" class="pantalla activa">

    <img
        src="img/dados3.jpg"
        alt="DADOS MAGICOS"
        class="imagen-portada">

    <h1 class="titulo-juego">
        DADOS MÁGICOS
    </h1>

    <button id="btnInicio" class="boton-inicio">
        INICIAR
    </button>

</div>




    <!-- DADO 1 -->
    <div id="pantalla1" class="pantalla">

        <h2>ACCION</h2>

        <div class="contenedor-dado">

            <div id="dado1" class="dado3d">

                <div class="cara frente">BESAR</div>
                <div class="cara atras">MORDER</div>
                <div class="cara derecha">ACARICIAR</div>
                <div class="cara izquierda">CHUPAR</div>
                <div class="cara arriba">MASAJEAR</div>
                <div class="cara abajo">GOLPEAR</div>

            </div>

        </div>

        <button id="relanzar1" disabled>
            Volver a lanzar
        </button>

        <button id="siguiente1" disabled>
            Siguiente
        </button>

    </div>

    <!-- DADO 2 -->
    <div id="pantalla2" class="pantalla">

        <h2>PARTE DEL CUERPO</h2>

        <div class="contenedor-dado">

            <div id="dado2" class="dado3d">

                <div class="cara frente">LABIOS</div>
                <div class="cara atras">CUELLO</div>
                <div class="cara derecha">ESPALDA</div>
                <div class="cara izquierda">GENITALES</div>
                <div class="cara arriba">PIES</div>
                <div class="cara abajo">PECHO</div>

            </div>

        </div>

        <button id="relanzar2" disabled>
            Volver a lanzar
        </button>

        <button id="siguiente2" disabled>
            Siguiente
        </button>

    </div>

    <!-- RESUMEN -->
    <div id="resumen" class="pantalla">

        <h2>Resultado Final</h2>

        <div id="final1" class="resultado"></div>

        <div id="final2" class="resultado"></div>

        <button id="reinicio">
            Volver al inicio
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
